# Standalone Windows x64 MSI build.
#
# The full `flutter-build.yml` builds Windows + macOS + Linux + mobile on every
# run, which is expensive (Windows minutes count 2x, macOS 10x). This workflow
# builds ONLY the Windows x64 installer so a change can be verified with one
# click and a fraction of the minutes.
#
# It reuses the two helper workflows `build-for-windows-flutter` depends on:
#   * .github/workflows/bridge.yml                                 (generated FFI bindings)
#   * .github/workflows/third-party-RustDeskTempTopMostWindow.yml  (privacy mode helper)
# and then replays that job's steps for the x64 target only. Keep the steps in
# sync with `build-for-windows-flutter` when that job changes.
#
# Signing is intentionally not wired up: without `SIGN_BASE_URL`/`SIGN_SECRET_KEY`
# the signed steps would be skipped anyway, and the MSI is still produced.

name: Windows MSI (x64)

on:
  workflow_dispatch:
    inputs:
      publish-release:
        description: "Create/update a GitHub release with the built MSI"
        type: boolean
        default: false
      release-tag:
        description: "Release tag to publish to"
        type: string
        default: "windows-msi"

permissions:
  contents: write

concurrency:
  group: windows-msi-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.82"
  FLUTTER_VERSION: "3.44.1"
  LLVM_VERSION: "15.0.6"
  VERSION: "1.3.0"
  # vcpkg version: 2025.08.27, keep in sync with flutter-build.yml
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-msi:
    name: windows-x64
    needs: [generate-bridge, build-RustDeskTempTopMostWindow]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35dca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-x64-windows-static-rel-out.log" || true

      - name: Build SubnetDesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          # The exe name comes from BINARY_NAME (flutter/windows/CMakeLists.txt) and
          # must match the --app-name passed to the MSI preprocess step below.
          if (-not (Test-Path ./rustdesk/lenovo-display.exe)) { throw "lenovo-display.exe not found in ./rustdesk" }

          # Virtual display driver, shipped next to the exe.
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build msi
        run: |
          New-Item -ItemType Directory -Force -Path ./SignOutput | Out-Null
          pushd ./res/msi
          python preprocess.py --arp --app-name lenovo-display --display-name "lenovo display" --manufacturer "lenovo display" -d ../../rustdesk
          if ($LASTEXITCODE -ne 0) { throw "MSI preprocessing failed with exit code $LASTEXITCODE" }
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          if (-not $msi) { throw "Package.msi was not produced" }
          mv $msi.FullName ../../SignOutput/subnetdesk-${{ env.VERSION }}-x86_64.msi
          popd
          Get-FileHash ./SignOutput/*.msi

      - name: Upload MSI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-msi-x86_64
          path: ./SignOutput/*.msi

      - name: Publish Release
        if: ${{ inputs.publish-release }}
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: true
          tag_name: ${{ inputs.release-tag }}
          files: ./SignOutput/*.msi
